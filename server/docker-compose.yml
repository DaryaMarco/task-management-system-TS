services:

  task-api:
    build:
      context: .

    container_name: task-management-api

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      MONGO_URI: mongodb://mongodb:27017/task-management

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:5000/health"
        ]

      interval: 30s
      timeout: 5s
      retries: 3


    restart: unless-stopped


    networks:
      - task-network



  mongodb:

    image: mongo:7

    container_name: task-management-mongodb


    ports:
      - "27017:27017"


    volumes:
      - mongo-data:/data/db


    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--eval",
          "db.adminCommand('ping')"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


    restart: unless-stopped


    networks:
      - task-network




volumes:

  mongo-data:



networks:

  task-network: